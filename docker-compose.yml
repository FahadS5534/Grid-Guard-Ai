version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: gridguard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: gridguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridguard_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/gridguard
      - JWT_SECRET=super-secret-gridguard-jwt-key-2025-power-grid
      - ML_MODE=mock
      - SIMULATOR_ENABLED=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridguard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
